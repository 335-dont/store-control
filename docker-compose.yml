services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store_dev_password}
    volumes:
      - store_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://store:${POSTGRES_PASSWORD:-store_dev_password}@db:5432/store
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  store_db:
